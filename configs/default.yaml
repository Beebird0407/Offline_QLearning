# Q-Mamba: Offline Meta-Learning of DE Hyperparameter Control via Mamba SSM + Adaptive CQL.
# See README.md for full documentation.

# === Dataset ===
dataset:
  dim: 5                     # Problem dimension (5, 10, 20)
  train_instances: 16        # Training instances per BBOB function
  test_instances: 1          # Testing instances per BBOB function
  mu: 0.5                    # Exploit/explore mix ratio
  n_total_trajectories: 10000  # Total trajectory count
  trajectory_length: 500     # Generations per trajectory
  seed: 42                   # Random seed
  n_workers: null            # Parallel workers (null=auto, 1=single-process)

# === State / Action ===
state_action:
  state_dim: 9               # Fixed 9-dim state representation
  K: 3                       # Action parameters (Alg0=3, Alg1=10, Alg2=16)
  M: 16                      # Discretisation bins per parameter

# === Algorithm ===
algorithm:
  type: "Alg1"               # Alg0 (K=3, pop=100) | Alg1 (K=10, pop=250) | Alg2 (K=16, pop=500)
  pop_size: 250              # Initial population size (set per algorithm above)
  use_lpsr: true             # Linear Population Size Reduction
  min_pop_size: 4            # Minimum population under LPSR

# === Model ===
model:
  type: "qmamba"             # Q-Mamba (Mamba SSM backbone with GRU fallback)
  d_model: 14                # Hidden dimension (state_dim + token_dim)
  d_state: 32                # Mamba SSM state dimension
  n_layers: 1                # Number of Mamba blocks
  num_hidden_mlp: 32         # Q-head hidden dimension

# === Training ===
training:
  lr: 0.005                  # Learning rate (AdamW)
  gamma: 0.99                # Discount factor
  beta: 10.0                 # TD-loss weight on the final chain-link action
  lam: 1.0                   # CQL regularisation strength (only used when adaptive_cql.enabled = false)
  batch_size: 64             # Batch size
  n_epochs: 50               # Training epochs
  grad_clip: 100.0           # Gradient clipping norm
  weight_decay: 0.0001       # AdamW weight decay
  eval_interval: 10          # Run validation every N epochs
  checkpoint_interval: 25    # Save checkpoint every N epochs
  print_every: 1             # Print metrics every N epochs
  scheduler: none            # LR scheduler: none | cosine | step

  # Dual-baseline adaptive CQL: λ rises when dropout-uncertainty spikes (OOD risk),
  # falls when uncertainty drops below long-term trend (in-distribution).
  adaptive_cql:
    enabled: true           # true or false
    lam_init: 1.0            # Initial λ
    lam_min: 0.01            # Minimum λ
    lam_max: 2.0             # Maximum λ
    dropout_p: 0.1           # Dropout rate for MC uncertainty estimation
    uncertainty_samples: 8   # MC dropout samples per estimate
    uncertainty_interval: 10 # Re-estimate uncertainty every N training steps

# === Evaluation ===
evaluation:
  n_runs: 19                 # Independent runs per test function
  n_runs_ood: 10             # Runs for OOD test

# === Ablation ===
ablation:
  lambda_values: [0.0, 1.0, 10.0]
  beta_values: [1.0, 10.0]
  mu_values: [0.0, 0.25, 0.5, 0.75, 1.0]
  bin_values: [16, 32, 64, 128, 256, 512]

# === Paths ===
paths:
  data_dir: "./data"
  checkpoint_dir: "./checkpoints"
  results_dir: "./results"
  dataset_path: "./data/ee_dataset.pkl"
